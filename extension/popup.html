<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 8px 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      color: #34d399;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">🎙️</div>
    <div>
      <h3>ActWise Anywhere</h3>
    </div>
  </div>
  <p>Voice sidecar is active on this browser tab. Look for the floating cyan microphone button in the lower-right corner.</p>
  <a href="https://actwise-live-218423701961.us-central1.run.app" target="_blank" class="btn">Open Full ActWise Live App</a>
  <div class="status">
    <div class="dot"></div>
    <span>Sidecar Ready (Manifest V3)</span>
  </div>
</body>
</html>
